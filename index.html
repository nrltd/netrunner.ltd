<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>N R N R</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text-size: 5vw;          /* size of the text */
    --line-height: 1.2;        /* vertical space each line occupies (fixes clipping) */
    --row-gap: 0.4vh;          /* gap between rows */
    --word-gap: 3vw;           /* horizontal gap between repeats */
    --speed: 18s;              /* time for one full scroll loop (higher = slower) */
    --rotation: -8deg;         /* tilt of the whole field */
    --zoom: 1.35;              /* scale so the tilted field still fills the screen */
    --bg: #000;                /* background colour */
    --fg: #ffffff;             /* text colour */
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: "Ubuntu", Arial, sans-serif;
  }

  * {
    font-family: inherit;
  }

  .stage {
    position: fixed;
    inset: 0;
    background: var(--bg);
    transform: rotate(var(--rotation)) scale(var(--zoom));
    transform-origin: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--row-gap);
  }

  .row {
    display: flex;
    overflow: hidden;
    width: 100%;
  }

  .row-track {
    display: flex;
    flex: none;
    white-space: nowrap;
    will-change: transform;
  }

  .row-track span {
    display: inline-block;
    font-weight: 700;
    font-size: var(--text-size);
    line-height: var(--line-height);
    letter-spacing: 0.05em;
    color: var(--fg);
    padding-right: var(--word-gap);
  }

  .row-left .row-track {
    animation: scroll-left var(--speed) linear infinite;
  }

  .row-right .row-track {
    animation: scroll-right var(--speed) linear infinite;
  }

  /* Each track is built from two identical halves back-to-back.
     Translating by exactly -50% of the whole track loops with no seam,
     because the pixel we end on is identical to the pixel we started on. */
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @keyframes scroll-right {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }

  .panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    background: rgba(20, 20, 20, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 18px;
    padding: 2.2rem 2.8rem;
    text-align: center;
    color: #ffffff;
    min-width: 320px;
    /* liquid glass */
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08);
  }

  .panel .name {
    font-size: 2rem;
    font-weight: 700;
    /*letter-spacing: 0.1em;*/
    margin: 0 0 0.9rem;
  }

  .panel .detail {
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    margin: 0.25rem 0;
    color: #ffffff;
    opacity: 0.85;
  }

  .panel a {
    color: #ffffff;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.4);
  }

  .panel a:hover {
    border-bottom-color: #ffffff;
  }

  @media (prefers-reduced-motion: reduce) {
    .row-track {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="panel">
  <p class="name">NETRUNNER LIMITED</p>
  <p class="detail">NZBN: 9429053038722</p>
  <p class="detail"><a href="mailto:admin@netrunner.ltd">admin@netrunner.ltd</a></p>
</div>

<script>
  const rowCount = 10;          // number of scrolling lines
  const repeatsPerHalf = 10;    // repeats of "N R" in ONE half of each track

  const stage = document.getElementById('stage');

  for (let i = 0; i < rowCount; i++) {
    const row = document.createElement('div');
    row.className = 'row ' + (i % 2 === 0 ? 'row-left' : 'row-right');

    const track = document.createElement('div');
    track.className = 'row-track';

    // Build one half, then clone it once to make an identical second half.
    // Because both halves are byte-for-byte identical, translating by -50%
    // lands exactly back on the start frame -> no visible jump, ever.
    let half = '';
    for (let j = 0; j < repeatsPerHalf; j++) {
      half += '<span>N R</span>';
    }
    track.innerHTML = half + half;

    row.appendChild(track);
    stage.appendChild(row);
  }
</script>

</body>
</html>
